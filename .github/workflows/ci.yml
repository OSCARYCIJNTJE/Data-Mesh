name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  integration-ci:
    name: Integration CI
    runs-on: ubuntu-latest

    env:
      MAX_MESSAGES: 10
      EVENT_INTERVAL_MS: 1000

    steps:
      # -----------------------------
      # 1. Checkout repositories
      # -----------------------------
      - name: Checkout data mesh + dashboard repo
        uses: actions/checkout@v4
        with:
          path: data-mesh

      - name: Checkout data observability repo
        uses: actions/checkout@v4
        with:
          repository: OSCARYCIJNTJE/Data-observability
          ref: ${{ github.ref_name }}
          path: data-observability

      # -----------------------------
      # 2. Validate Docker setup
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose file
        working-directory: data-mesh/kafka
        run: docker compose config

      # -----------------------------
      # 3. Build project services
      # -----------------------------
      - name: Build Kafka producer app
        working-directory: data-mesh/kafka
        run: docker compose build construction-app

      - name: Build dbt pipeline
        working-directory: data-mesh/kafka
        run: docker compose build dbt-pipeline

      - name: Build construction dashboard
        working-directory: data-mesh/kafka
        run: docker compose build construction-dashboard

      # -----------------------------
      # 4. Start infrastructure
      # -----------------------------
      - name: Start Kafka
        working-directory: data-mesh/kafka
        run: docker compose up -d kafka

      - name: Start ksqlDB
        working-directory: data-mesh/kafka
        run: docker compose up -d ksqldb

      - name: Wait for ksqlDB
        working-directory: data-mesh/kafka
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8088/info; then
              echo "ksqlDB is ready"
              exit 0
            fi

            echo "Waiting for ksqlDB..."
            sleep 5
          done

          docker compose logs ksqldb
          exit 1

      # -----------------------------
      # 5. Run producer
      # -----------------------------
      - name: Start construction event producer
        working-directory: data-mesh/kafka
        run: |
          EVENT_INTERVAL_MS=${EVENT_INTERVAL_MS} docker compose up -d construction-app

      - name: Give producer time to create events
        run: sleep 50

      
      - name: Debug Kafka topics and producer logs
        working-directory: data-mesh/kafka
        run: |
          echo "=== construction-app logs ==="
          docker compose logs construction-app

          echo "=== Kafka topics ==="
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --list

          echo "=== Messages on site-health-stream ==="
          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server kafka:29092 \
            --topic site-health-stream \
            --from-beginning \
            --timeout-ms 10000 \
            --max-messages 5

      # -----------------------------
      # 6. Run dbt ELT pipeline
      # -----------------------------
      # - name: Run dbt pipeline
      #   working-directory: data-mesh/kafka
      #   timeout-minutes: 5
      #   env:
      #     MAX_MESSAGES: 10
      #     CONSUMER_TIMEOUT_MS: 60000
      #   run: |
      #     docker compose up \
      #       --abort-on-container-exit \
      #       --exit-code-from dbt-pipeline \
      #       dbt-pipeline

      # -----------------------------
      # 7. Smoke test dashboard
      # -----------------------------
      - name: Start construction dashboard
        working-directory: data-mesh/kafka
        run: docker compose up -d construction-dashboard

      - name: Check dashboard container
        working-directory: data-mesh/kafka
        run: |
          sleep 10
          docker compose ps construction-dashboard
          docker compose logs construction-dashboard

      # -----------------------------
      # 8. Debug on failure
      # -----------------------------
      - name: Show all logs on failure
        if: failure()
        working-directory: data-mesh/kafka
        run: docker compose logs

      # -----------------------------
      # 9. Cleanup
      # -----------------------------
      - name: Shutdown containers
        if: always()
        working-directory: data-mesh/kafka
        run: docker compose down -v