name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  docker-deploy:
    name: Build, Push and Deploy Docker Images
    runs-on: [self-hosted, Windows]

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout data mesh + dashboard repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Checkout data observability repo
        uses: actions/checkout@v4
        with:
          repository: OSCARYCIJNTJE/Data-observability
          ref: ${{ github.event.workflow_run.head_branch }}
          path: data-observability

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()

          "CONSTRUCTION_APP_IMAGE=ghcr.io/$owner/construction-app:latest" >> $env:GITHUB_ENV
          "DASHBOARD_IMAGE=ghcr.io/$owner/construction-dashboard:latest" >> $env:GITHUB_ENV
          "DBT_PIPELINE_IMAGE=ghcr.io/$owner/dbt-pipeline:latest" >> $env:GITHUB_ENV

      - name: Build and push construction app
        uses: docker/build-push-action@v6
        with:
          context: ./kafka
          file: ./kafka/Dockerfile
          push: true
          tags: ${{ env.CONSTRUCTION_APP_IMAGE }}

      - name: Build and push construction dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./construction-dashboard
          file: ./construction-dashboard/dockerfile
          push: true
          tags: ${{ env.DASHBOARD_IMAGE }}

      - name: Build and push dbt pipeline
        uses: docker/build-push-action@v6
        with:
          context: ./data-observability
          file: ./data-observability/dockerfile.dbt
          push: true
          tags: ${{ env.DBT_PIPELINE_IMAGE }}

      - name: Pull latest images locally
        working-directory: ./kafka
        run: docker compose pull

      - name: Start containers locally
        working-directory: ./kafka
        run: docker compose up -d --force-recreate